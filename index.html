<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unblocked Games Hub</title>
    <!-- We use the Tailwind CDN for maximum portability on GitHub Pages -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
      .glass-card {
        background: rgba(24, 24, 27, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
      }
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #09090b; }
      ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
      
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="sticky top-0 z-40 glass-card border-b border-white/5 px-6 py-4 flex items-center justify-between">
      <div id="logo" class="flex items-center gap-2 cursor-pointer group">
        <div class="bg-emerald-500 p-2 rounded-lg group-hover:rotate-12 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-black"><line x1="6" x2="10" y1="12" y2="12"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="15" x2="15" y1="13" y2="13"></line><line x1="18" x2="18" y1="11" y2="11"></line><rect width="20" height="12" x="2" y="6" rx="2"></rect></svg>
        </div>
        <h1 class="text-xl font-display font-bold tracking-tight">
          UNBLOCKED<span class="text-emerald-500">GAMES</span>
        </h1>
      </div>

      <div class="hidden md:flex items-center bg-zinc-900 border border-white/10 rounded-full px-4 py-2 w-96 focus-within:border-emerald-500/50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-500 mr-2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search games..."
          class="bg-transparent border-none outline-none text-sm w-full text-white"
        />
      </div>

      <div class="flex items-center gap-4">
        <button id="fullscreen-btn" class="p-2 hover:bg-white/5 rounded-full transition-colors" title="Toggle Fullscreen">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
        </button>
      </div>
    </nav>

    <main id="main-content" class="flex-1 container mx-auto px-6 py-8">
      <!-- Content will be injected by main.js -->
      <div id="home-view" class="space-y-8">
        <!-- Hero Section -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600/20 to-zinc-900 border border-emerald-500/20 p-8 md:p-12">
          <div class="relative z-10 max-w-2xl">
            <h2 class="text-4xl md:text-5xl font-display font-bold mb-4">
              Play the best games, <br />
              <span class="text-emerald-500 underline decoration-emerald-500/30 underline-offset-8">anywhere.</span>
            </h2>
            <p class="text-zinc-400 text-lg mb-8">
              A curated collection of unblocked web games. No downloads, no blocks, just pure fun.
            </p>
            <div id="category-filters" class="flex flex-wrap gap-3">
              <!-- Categories injected here -->
            </div>
          </div>
          <div class="absolute top-0 right-0 w-1/2 h-full opacity-10 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full rotate-12 translate-x-1/4"><line x1="6" x2="10" y1="12" y2="12"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="15" x2="15" y1="13" y2="13"></line><line x1="18" x2="18" y1="11" y2="11"></line><rect width="20" height="12" x="2" y="6" rx="2"></rect></svg>
          </div>
        </section>

        <!-- Mobile Search -->
        <div class="md:hidden flex items-center bg-zinc-900 border border-white/10 rounded-xl px-4 py-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-500 mr-3"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input
            id="mobile-search-input"
            type="text"
            placeholder="Search games..."
            class="bg-transparent border-none outline-none text-base w-full text-white"
          />
        </div>

        <!-- Games Grid Section -->
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h3 id="grid-title" class="text-xl font-display font-bold flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
              Trending Games
            </h3>
            <span id="game-count" class="text-sm text-zinc-500">0 games found</span>
          </div>

          <div id="game-grid" class="game-grid">
            <!-- Games injected here -->
          </div>
        </div>
      </div>

      <!-- Player View (Hidden by default) -->
      <div id="player-view" class="hidden h-[calc(100vh-160px)] flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <button id="back-btn" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors group">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"><path d="m15 18-6-6 6-6"></path></svg>
            Back to Hub
          </button>
          <div class="flex items-center gap-4">
            <h2 id="active-game-title" class="text-xl font-display font-bold">Game Title</h2>
            <div class="h-4 w-[1px] bg-zinc-800"></div>
            <a id="external-link" href="#" target="_blank" rel="noopener noreferrer" class="p-2 hover:bg-white/5 rounded-full text-zinc-400 hover:text-emerald-400 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
            </a>
          </div>
        </div>

        <div class="flex-1 relative glass-card rounded-3xl overflow-hidden shadow-2xl shadow-emerald-500/5">
          <iframe id="game-iframe" src="" class="w-full h-full border-none" allowfullscreen sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
        </div>

        <div class="flex items-center justify-between px-2">
          <div class="flex items-center gap-6 text-sm text-zinc-500">
            <div class="flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
              <span>Fast Loading</span>
            </div>
            <div class="flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
              <span>High Quality</span>
            </div>
          </div>
          <button id="close-game-btn" class="text-zinc-500 hover:text-red-400 transition-colors flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            Close Game
          </button>
        </div>
      </div>
    </main>

    <footer class="glass-card border-t border-white/5 px-6 py-8 mt-auto">
      <div class="container mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><line x1="6" x2="10" y1="12" y2="12"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="15" x2="15" y1="13" y2="13"></line><line x1="18" x2="18" y1="11" y2="11"></line><rect width="20" height="12" x="2" y="6" rx="2"></rect></svg>
          <span class="font-display font-bold text-sm tracking-widest uppercase">
            Unblocked Games Hub &copy; 2026
          </span>
        </div>
        
        <div class="flex items-center gap-8 text-sm text-zinc-500">
          <a href="#" class="hover:text-emerald-400 transition-colors">Privacy Policy</a>
          <a href="#" className="hover:text-emerald-400 transition-colors">Terms of Service</a>
          <a href="#" className="hover:text-emerald-400 transition-colors">Contact</a>
        </div>

        <div class="flex items-center gap-4">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs text-zinc-500 font-mono uppercase">All Systems Operational</span>
        </div>
      </div>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
